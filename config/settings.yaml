timezone: "+08:00"          # Digest dates and schedule are in GMT+8.
schedule: "07:00"           # First Run of the day.
backup_runs: 2              # Extra Runs, one hour apart, that exit if today's Digest exists.
                            # Each uses one of the Pro plan's 5 routine runs/day; lower this if
                            # other routines need the quota.
fetch_attempts: 3           # Attempts per network step before it counts as failed.
first_run_lookback_hours: 24
telegram_top_n: 5           # Top Stories in the Telegram message (topped up from neutral).
