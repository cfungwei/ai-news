timezone: "+08:00"          # Digest dates and schedule are in GMT+8.
editions: ["06:30", "11:30", "16:30", "21:30"]
                            # One Run per Edition. Must match the routine's cron
                            # (30 6,11,16,21 * * *). Each uses one of the Pro plan's 5 routine
                            # runs a day. A failed Edition's news arrives in the next one.
fetch_attempts: 3           # Attempts per network step before it counts as failed.
first_run_lookback_hours: 24
health_summary_day: Monday  # The weekly Source health summary goes to Telegram on this day.
site_url: "https://cfungwei.github.io/ai-news/"
digests_branch: digests
votes_url: "https://ai-news-votes.ai-news-fungi.workers.dev"              # The Cloudflare Worker in worker/; empty hides the vote buttons.
